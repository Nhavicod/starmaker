<!DOCTYPE html>
<html>
<head>
<style>
    .section-inner{width:min(1180px,100%);margin:auto}
    section{padding:75px 18px}
    .cards{display:grid;grid-template-columns:repeat(3, minmax(0, 230px));justify-content:center;gap:24px}
    .card{min-height:370px; border:1px solid red;}
    @media(max-width:900px){
      .cards{grid-template-columns:1fr 1fr}
    }
    @media(max-width:620px){
      section{padding:75px 18px}
      .cards{grid-template-columns:1fr}
      .card{min-height:340px}
    }
</style>
</head>
<body>
<section>
  <div class="section-inner">
    <div class="cards">
      <div class="card"></div>
    </div>
  </div>
</section>
</body>
</html>
